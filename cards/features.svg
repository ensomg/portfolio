<svg xmlns="http://www.w3.org/2000/svg" width="840" height="286" viewBox="0 0 840 286" role="img">
<style>@font-face{font-family:'Exo 2';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}.t{font-family:'Exo 2',sans-serif;font-weight:600;fill:#fff;letter-spacing:.5px}.m{font-family:'JetBrains Mono',monospace;font-weight:500;fill:#fff}.in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.float{animation:float 4.5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px)}}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
